name: Deploy GitHub Pages
permissions:
  contents: read
on:
  push:
    branches: [develop]
    paths:
      - "docs/**"
      - "docs-md/wiki/**"
      - "scripts/sync-docs-wiki.mjs"
      - ".github/workflows/pages.yml"
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, develop]
    paths:
      - "docs/**"
      - "docs-md/wiki/**"
      - "scripts/sync-docs-wiki.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build documentation site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install dependencies
        working-directory: docs
        run: npm install --ignore-scripts --no-package-lock

      - name: Build documentation
        working-directory: docs
        run: npm run build

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy to GitHub Pages
    # Publish pushes to develop, and manual runs only when dispatched from develop,
    # so a run from any other branch cannot replace the public site.
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/develop')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
