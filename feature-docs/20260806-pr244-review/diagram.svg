<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><rect width="1000" height="520" fill="#ffffff"/><text x="500" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">Where the dropdown lands, and what paints on top of it</text><text x="500" y="52" text-anchor="middle" font-size="12.5" fill="#5a6270">Mantine popover inside a BC DS (React Aria) modal — two overlay systems, two stacking contexts</text><rect x="24" y="72" width="452" height="424" rx="8" fill="#fdf6f5" stroke="#d9534f" stroke-width="1.4"/><text x="44" y="97" font-size="14" font-weight="700" fill="#a32e2a">BEFORE — dropdown portals to &lt;body&gt;</text><rect x="44" y="112" width="412" height="30" rx="4" fill="#eceff3" stroke="#9aa4b2"/><text x="58" y="132" font-size="12.5" font-weight="600" fill="#333">document.body</text><path d="M60 142 L60 176 L84 176" fill="none" stroke="#9aa4b2" stroke-width="1.4"/><rect x="84" y="160" width="372" height="66" rx="4" fill="#fff" stroke="#c2cad6"/><text x="98" y="180" font-size="12" fill="#333">&lt;div&gt; portal target</text><rect x="98" y="188" width="230" height="28" rx="3" fill="#e8eefb" stroke="#7f9fd6"/><text x="110" y="207" font-size="12" fill="#20406e">.mantine-Select-dropdown</text><rect x="352" y="188" width="92" height="28" rx="14" fill="#d9534f"/><text x="398" y="207" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">z-index 300</text><path d="M60 142 L60 264 L84 264" fill="none" stroke="#9aa4b2" stroke-width="1.4"/><rect x="84" y="248" width="372" height="180" rx="4" fill="#fff" stroke="#c2cad6"/><text x="98" y="268" font-size="12" fill="#333">.react-aria-ModalOverlay</text><rect x="352" y="252" width="92" height="26" rx="13" fill="#2b6cb0"/><text x="398" y="270" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">z-index 1000</text><rect x="100" y="286" width="340" height="128" rx="4" fill="#f7f9fc" stroke="#c2cad6"/><text x="114" y="305" font-size="12" fill="#333">.bcds-app-modal</text><rect x="114" y="316" width="312" height="86" rx="3" fill="#fff" stroke="#c2cad6"/><text x="128" y="335" font-size="12" fill="#333">.bcds-modal-body</text><text x="128" y="354" font-size="11.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#a32e2a">overflow: hidden</text><text x="128" y="373" font-size="11.5" fill="#a32e2a">scrollHeight 940 &gt; clientHeight 683</text><text x="128" y="391" font-size="11.5" font-weight="700" fill="#a32e2a">257px unreachable, no scrollbar</text><text x="250" y="455" text-anchor="middle" font-size="12.5" font-weight="600" fill="#a32e2a">1000 &gt; 300 — the overlay paints over the dropdown</text><text x="250" y="476" text-anchor="middle" font-size="11.5" fill="#7a4340">elementFromPoint(option) returned the modal's Split field</text><rect x="524" y="72" width="452" height="424" rx="8" fill="#f4faf6" stroke="#2f855a" stroke-width="1.4"/><text x="544" y="97" font-size="14" font-weight="700" fill="#226b46">AFTER — dropdown stays inside the modal</text><rect x="544" y="112" width="412" height="30" rx="4" fill="#eceff3" stroke="#9aa4b2"/><text x="558" y="132" font-size="12.5" font-weight="600" fill="#333">document.body</text><path d="M560 142 L560 176 L584 176" fill="none" stroke="#9aa4b2" stroke-width="1.4"/><rect x="584" y="160" width="372" height="268" rx="4" fill="#fff" stroke="#c2cad6"/><text x="598" y="180" font-size="12" fill="#333">.react-aria-ModalOverlay</text><rect x="852" y="164" width="92" height="26" rx="13" fill="#2b6cb0"/><text x="898" y="182" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">z-index 1000</text><rect x="600" y="198" width="340" height="214" rx="4" fill="#f7f9fc" stroke="#c2cad6"/><text x="614" y="217" font-size="12" fill="#333">.bcds-app-modal</text><text x="614" y="235" font-size="11.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#226b46">max-height: calc(100vh - 2 × margin)</text><rect x="614" y="245" width="312" height="152" rx="3" fill="#fff" stroke="#c2cad6"/><text x="628" y="264" font-size="12" fill="#333">.bcds-modal-body</text><text x="628" y="282" font-size="11.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#226b46">overflow-y: auto → the form scrolls</text><rect x="628" y="296" width="284" height="88" rx="3" fill="#e8f5ee" stroke="#2f855a"/><text x="642" y="315" font-size="12" fill="#20406e">.mantine-Select-dropdown</text><text x="642" y="333" font-size="11.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#333">withinPortal: false</text><text x="642" y="351" font-size="11.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#333">floatingStrategy: "fixed"</text><rect x="642" y="360" width="140" height="18" rx="9" fill="#2f855a"/><text x="712" y="374" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">inline z-index 1100</text><text x="750" y="455" text-anchor="middle" font-size="12.5" font-weight="600" fill="#226b46">Same stacking context as the modal — nothing can cover it</text><text x="750" y="476" text-anchor="middle" font-size="11.5" fill="#3f6b53">"fixed" keeps it from being clipped by the now-scrolling body</text></svg>