<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="420" rx="8" fill="#ffffff" stroke="#e2e8f0"/>

  <text x="24" y="34" font-size="15" font-weight="600" fill="#1e293b">Why PR #184 looks huge but isn't — branch topology (sequence, not to scale)</text>

  <!-- develop lane -->
  <text x="24" y="95" font-size="13" font-weight="600" fill="#475569">develop</text>
  <line x1="95" y1="90" x2="950" y2="90" stroke="#475569" stroke-width="2"/>
  <!-- #221 merge point on develop -->
  <circle cx="675" cy="90" r="5" fill="#ffffff" stroke="#475569" stroke-width="2"/>
  <text x="675" y="66" font-size="12" fill="#475569" text-anchor="middle">PR #221 merged · Jul 20</text>
  <!-- #169 on develop -->
  <circle cx="748" cy="90" r="4" fill="#475569"/>
  <text x="744" y="114" font-size="12" fill="#64748b" text-anchor="end" stroke="#ffffff" stroke-width="4" paint-order="stroke">PR #169 · Jul 29</text>

  <!-- experiments stack lane -->
  <text x="24" y="175" font-size="13" font-weight="600" fill="#94a3b8">E01–E08 stack</text>
  <line x1="140" y1="170" x2="430" y2="170" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" opacity="0.55"/>
  <text x="285" y="150" font-size="12" fill="#64748b" text-anchor="middle">extraction-engine bake-off, PRs #155–#165 (all closed)</text>
  <!-- stack -> develop via #221 -->
  <path d="M 430 166 C 540 140, 610 110, 666 94" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-muted)"/>
  <text x="562" y="122" font-size="12" fill="#64748b" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">landed on develop as “release-up-to-08-part-2”</text>
  <!-- stack -> E09 -->
  <path d="M 430 176 C 490 205, 525 235, 553 258" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-muted)"/>
  <text x="432" y="228" font-size="12" fill="#64748b" text-anchor="end">merged into E09 · Jul 13</text>

  <!-- E09 lane -->
  <text x="24" y="275" font-size="13" font-weight="600" fill="#2563eb">experiment/09-</text>
  <text x="24" y="291" font-size="13" font-weight="600" fill="#2563eb">sdpr-hitl</text>
  <line x1="140" y1="270" x2="905" y2="270" stroke="#2563eb" stroke-width="2"/>

  <!-- E09 events -->
  <circle cx="165" cy="270" r="5" fill="#2563eb"/>
  <text x="165" y="304" font-size="12" fill="#1e293b" text-anchor="middle">inline canvas</text>
  <text x="165" y="319" font-size="12" fill="#1e293b" text-anchor="middle">editor · Jun 1</text>

  <circle cx="270" cy="270" r="6" fill="#dc2626"/>
  <text x="270" y="335" font-size="12" font-weight="600" fill="#dc2626" text-anchor="middle">stray commit b412141</text>
  <text x="270" y="350" font-size="12" fill="#dc2626" text-anchor="middle">Figma capture script · Jun 24</text>

  <circle cx="375" cy="270" r="4" fill="#2563eb"/>
  <text x="375" y="304" font-size="12" fill="#64748b" text-anchor="middle">evaluator</text>
  <text x="375" y="319" font-size="12" fill="#64748b" text-anchor="middle">refactor · Jul 2</text>

  <!-- develop -> E09 merge Jul 13 -->
  <line x1="470" y1="96" x2="470" y2="260" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-slate)"/>
  <circle cx="470" cy="270" r="4" fill="#2563eb"/>
  <text x="464" y="200" font-size="12" fill="#64748b" text-anchor="end" stroke="#ffffff" stroke-width="4" paint-order="stroke">develop merged in · Jul 13</text>

  <circle cx="560" cy="270" r="4" fill="#2563eb"/>

  <!-- develop -> E09 merge Aug 1 -->
  <line x1="790" y1="96" x2="790" y2="260" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-slate)"/>
  <circle cx="790" cy="270" r="5" fill="#2563eb"/>
  <text x="782" y="184" font-size="12" fill="#1e293b" text-anchor="end" stroke="#ffffff" stroke-width="4" paint-order="stroke">develop merged in · Aug 1 (today)</text>

  <circle cx="875" cy="270" r="6" fill="#059669"/>
  <text x="875" y="304" font-size="12" font-weight="600" fill="#059669" text-anchor="middle">revert of b412141 · Aug 1</text>
  <text x="875" y="319" font-size="12" fill="#059669" text-anchor="middle">= current tip e53ad11</text>

  <!-- the PR arrow -->
  <path d="M 905 262 C 940 240, 952 160, 950 100" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="936" y="180" font-size="12" font-weight="600" fill="#2563eb" text-anchor="end">this PR (#184)</text>
  <text x="936" y="196" font-size="12" fill="#2563eb" text-anchor="end">real delta: 75 files</text>
  <text x="936" y="212" font-size="12" fill="#2563eb" text-anchor="end">+1,262 / −393</text>

  <text x="24" y="390" font-size="12" fill="#64748b">GitHub diffs #184 from a stale merge base and shows +601k lines — but everything the E01–E08 stack contributed is already on develop</text>
  <text x="24" y="406" font-size="12" fill="#64748b">via PR #221, so the only new material is the blue lane’s own commits.</text>
</svg>
