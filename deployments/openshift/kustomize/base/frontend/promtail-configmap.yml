apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-promtail
  labels:
    app: frontend
data:
  promtail.yaml: |
    server:
      http_listen_port: 0
      grpc_listen_port: 0
    positions:
      filename: /tmp/positions.yaml
    clients:
      - url: http://loki:3100/loki/api/v1/push
    scrape_configs:
      - job_name: frontend
        static_configs:
          - targets:
              - localhost
            labels:
              service: frontend
              __path__: /var/log/app/*.log
        pipeline_stages:
          # Drop kubelet probe hits. Both probes request "/", the same path a
          # real page load uses, so the user agent is the only thing that tells
          # them apart. ~18 lines/minute/replica, and the bulk of this log.
          - drop:
              expression: '"kube-probe/'
          # Drop health-check hits. nginx logs the combined format, so match the
          # quoted request line rather than the backend's JSON "path" field.
          - drop:
              expression: '"(GET|HEAD) /(api/)?health[ /?]'
          # Drop metrics checks
          - drop:
              expression: '"GET /metrics[ /?]'
