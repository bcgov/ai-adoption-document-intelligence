apiVersion: v1
kind: ConfigMap
metadata:
  name: temporal-worker-config
  labels:
    app: temporal-worker
data:
  TEMPORAL_ADDRESS: "temporal:7233"
  TEMPORAL_NAMESPACE: "default"
  TEMPORAL_TASK_QUEUE: "ocr-processing"
  AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT: "https://your-azure-endpoint.cognitiveservices.azure.com"
  # Set to "true" for worker OCR activities only (no live Document Intelligence). See docs-md/benchmarking/LOAD_TESTING.md
  MOCK_AZURE_OCR: "false"
  # Blob storage
  BLOB_STORAGE_PROVIDER: "minio"
  AZURE_STORAGE_CONTAINER_NAME: "document-blobs"
  # MinIO configuration; only consumed when BLOB_STORAGE_PROVIDER=minio.
  # The instance-template overlay rewrites these for per-instance MinIO Services.
  MINIO_ENDPOINT: "http://minio:9000"
  MINIO_DOCUMENT_BUCKET: "document-blobs"
  # Benchmarking
  BENCHMARK_TASK_QUEUE: "benchmark-processing"
  ENABLE_BENCHMARK_QUEUE: "true"
  # Billing maintenance worker — nightly storage charge and month-end archival workflows
  BILLING_TASK_QUEUE: "billing-maintenance"
  # Retention period (days) for UsageEvent rows purged during month-end archival (default: 730)
  USAGE_EVENT_RETENTION_DAYS: "730"
  # Azure OpenAI (enrichment)
  AZURE_OPENAI_ENDPOINT: ""
  AZURE_OPENAI_DEPLOYMENT: ""
  AZURE_OPENAI_API_VERSION: "2024-02-15-preview"
  ENRICHMENT_REDACT_PII: "false"
  # Phase 6 dynamic nodes — deno-runner sidecar (internal ClusterIP service).
  # The worker POSTs /execute here at run time; without this the client defaults
  # to localhost:9099 and cannot reach the runner, so every dyn.run fails.
  DENO_RUNNER_URL: "http://deno-runner:9090"
  # Base URL injected into dynamic-node scripts as AI_DI_API_BASE_URL so they can
  # call back into the platform API. In-cluster this is the backend Service —
  # the localhost default is only valid for host-based local dev.
  AI_DI_API_BASE_URL: "http://backend-services:3002"
  # Global egress allowlist for dynamic-node scripts (comma-separated hosts).
  # MUST stay identical to backend-services-config: the backend enforces it at
  # publish time, the worker re-enforces it at run time. Empty = scripts may
  # reach only AI_DI_API_BASE_URL.
  DYNAMIC_NODE_ALLOW_NET: ""
  # Database Connection Pool
  # Maximum number of database connections per worker pod (default: 3)
  # Workers have lighter database load than backend-services
  DB_POOL_MAX: "3"
  # Worker Concurrency Configuration
  # Controls how many tasks each worker pod can process in parallel
  # Scale these based on: worker pod resources, activity I/O patterns, and desired throughput
  # With HPA scaling 2-4 worker pods, total capacity is: pods * maxConcurrentActivityTaskExecutions
  #
  # maxConcurrentActivityTaskExecutions: Max parallel activities per worker (default: 10)
  # Activities are I/O-bound (Azure AI calls, DB queries), so 10 per pod is reasonable
  # Total capacity: 4 pods * 10 = 40 concurrent activities at max scale
  #
  # maxConcurrentWorkflowTaskExecutions: Max parallel workflow decision tasks per worker (default: 100)
  # Workflow tasks are lightweight (in-memory decision logic), so 100 per pod is safe
  # Total capacity: 4 pods * 100 = 400 concurrent workflow tasks at max scale
  MAX_CONCURRENT_ACTIVITY_TASK_EXECUTIONS: "10"
  MAX_CONCURRENT_WORKFLOW_TASK_EXECUTIONS: "100"
