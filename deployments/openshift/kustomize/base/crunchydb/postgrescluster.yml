apiVersion: postgres-operator.crunchydata.com/v1beta1
kind: PostgresCluster
metadata:
  name: app-pg
spec:
  shutdown: false
  instances:
    - replicas: 2
      resources:
        requests:
          cpu: '125m'
          memory: '256Mi'
      dataVolumeClaimSpec:
        accessModes:
          - 'ReadWriteOnce'
        resources:
          requests:
            storage: 1.5Gi
      sidecars:
        replicaCertCopy:
          resources:
            requests:
              cpu: '5m'
              memory: '10Mi'
  backups:
    pgbackrest:
      global:
        # Keep the 2 most recent full backups (covers ~2 weeks with weekly fulls).
        # All incrementals newer than the oldest retained full are also kept.
        # Use count-based retention so the window doesn't grow unboundedly when
        # a scheduled full is missed.
        repo1-retention-full: '2'
        repo1-retention-full-type: count
        # Block incremental: back up only the changed blocks within a file rather
        # than re-copying the whole changed file segment. Prevents backup/WAL
        # bloat from high-churn tables (e.g. ocr_results), which previously filled
        # the repo, stalled WAL archiving, and crashed the DB. Requires bundling.
        # (pgBackRest 2.46+)
        repo1-block: 'y'
        repo1-bundle: 'y'
        # zstd compression: better ratio and faster than the default gzip,
        # well-supported in pgBackRest 2.46+ and Crunchy PGO 5.x.
        # Level 3 is the fast default; raise to 6 for ~10% better ratio at
        # the cost of higher CPU during backup windows.
        repo1-compress-type: zst
        repo1-compress-level: '3'
      repos:
        - name: repo1
          schedules:
            # Full backup once per week (Sunday 02:00). Weekly fulls combined
            # with block-incremental backups keep the repo small while still
            # providing intra-day recovery points.
            full: '0 2 * * 0'
            # Incremental every 4 hours. Hourly incrementals were overkill given
            # that source files live in blob storage; 4-hour RPO is sufficient.
            incremental: '0 */4 * * *'
          volume:
            volumeClaimSpec:
              storageClassName: netapp-file-backup
              accessModes:
                - 'ReadWriteOnce'
              resources:
                requests:
                  storage: 10Gi # prod override in components/prod-resources; test uses this base value
      repoHost:
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
      sidecars:
        pgbackrest:
          resources:
            requests:
              cpu: '50m'
              memory: '150Mi'
        pgbackrestConfig:
          resources:
            requests:
              cpu: '5m'
              memory: '10Mi'
  postgresVersion: 16
  # image: 'registry.redhat.io/rhel8/postgresql-15'  # Use Crunchy Data equivalent image
  patroni:
    dynamicConfiguration:
      postgresql:
        pg_hba: 'host all all 0.0.0.0/0 md5'
        parameters:
          effective_cache_size: 256MB #helps the PostgreSQL query planner guess how much memory is available for disk caching. For read-heavy workloads, setting this to a higher value (50-75% of total RAM) can be beneficial
          shared_buffers: 64MB # default is 128MB; a good tuned default for shared_buffers is 25% of the memory allocated to the pod
          wal_buffers: '3MB' # this can be set to -1 to automatically set as 1/32 of shared_buffers or 64kB, whichever is larger
          min_wal_size: 32MB
          max_wal_size: 64MB # default is 1GB
          max_slot_wal_keep_size: 128MB # default is -1, allowing unlimited wal growth when replicas fall behind
          logging_collector: 'on'
          log_directory: 'log'
          log_filename: 'postgresql.log'
          log_truncate_on_rotation: 'on'
          log_rotation_age: '1440'
          log_rotation_size: '50000'
  # proxy:
  #   pgBouncer:
  #     replicas: 2
  #     requests:
  #       cpu: 1m
  #       memory: 64Mi
  primary:
    expose:
      service:
        type: ClusterIP
        ports:
          - name: postgresql
            port: 5432
            protocol: TCP
            targetPort: 5432
  users:
    - name: admin
      options:  "SUPERUSER"
      databases:
        - api