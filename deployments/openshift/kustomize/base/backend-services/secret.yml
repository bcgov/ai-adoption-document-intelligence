apiVersion: v1
kind: Secret
metadata:
  name: backend-services-secrets
  labels:
    app: backend-services
type: Opaque
stringData:
  AZURE_DOCUMENT_INTELLIGENCE_API_KEY: "your-azure-api-key-here"
  SSO_CLIENT_SECRET: "your-sso-client-secret-here"
  # APIM subscription key for Azure OpenAI. Deliberately a SECOND copy of the
  # value in temporal-worker-secrets, not a shared secret: the two deployments
  # keep separate secrets here (AZURE_DOCUMENT_INTELLIGENCE_API_KEY and the
  # AZURE_STORAGE_* keys are already duplicated the same way), and every writer
  # — deploy-instance.yml, oc-deploy-instance.sh, rotate-prod-secrets.sh —
  # writes both from one source, so there is still only one value to rotate.
  AZURE_OPENAI_API_KEY: "your-azure-openai-api-key-here"
  AZURE_STORAGE_CONNECTION_STRING: "your-azure-storage-connection-string-here"
  AZURE_STORAGE_ACCOUNT_NAME: "your-azure-storage-account-name-here"
  AZURE_STORAGE_ACCOUNT_KEY: "your-azure-storage-account-key-here"

