apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-services
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend-services
  # Start with 2 replicas for HA. The deployment starts at 1, and HPA will scale to 2.
  # This is safe: RollingUpdate strategy ensures pods start sequentially, and the
  # initContainer with Prisma advisory locks prevents migration races.
  minReplicas: 2
  # Max 3 replicas: with DB_POOL_MAX=10 per pod, that's 30 connections.
  # Combined with temporal workers (max 3 * 3 = 9), total is 39 of Postgres default 100.
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 120
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
        - type: Pods
          value: 1
          periodSeconds: 60
      selectPolicy: Max
