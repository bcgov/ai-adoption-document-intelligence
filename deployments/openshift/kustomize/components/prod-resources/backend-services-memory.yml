apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-services
spec:
  template:
    spec:
      containers:
        - name: backend-services
          resources:
            # The limit is the only memory value prod needs above base: 2Gi of
            # OOM headroom for sustained document-processing batches, where
            # base/test keep 1536Mi.
            #
            # The request is deliberately absent. Strategic-merge patches merge
            # maps, so omitting it lets base's request flow through untouched.
            # The request is the denominator of the HPA's memory utilization
            # ratio, so a prod-only copy of it — even one that matches base
            # today — would silently override the next change to base and
            # recreate the problem this patch was written to solve.
            limits:
              memory: "2Gi"
