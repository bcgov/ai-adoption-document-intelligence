apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-services
spec:
  template:
    spec:
      containers:
        - name: backend-services
          resources:
            # The request must track the base manifest, because the request is
            # the HPA's memory denominator: leaving it behind at 512Mi while
            # base moves to 1Gi keeps prod reading the high utilization ratio
            # this component was created to fix. Only the limit is genuinely
            # prod-specific — prod keeps 2Gi of OOM headroom for sustained
            # document-processing batches, where base/test keep 1536Mi.
            requests:
              memory: "1Gi"
            limits:
              memory: "2Gi"
