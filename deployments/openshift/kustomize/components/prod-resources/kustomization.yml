apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Production-only resource overrides.
#
# It applies the production-only source-IP allowlist to the public Routes: the
# base Routes are intentionally open (so test/dev/PR instances need no VPN), and
# prod restricts ingress to the BC Gov 142.x range via the patches below. It also
# gives backend-services more memory headroom than base, for OOM protection under
# sustained document-processing batches.
#
# This component is included by scripts/lib/generate-overlay.sh automatically
# when the target namespace is *-prod, and Kustomize applies it AFTER the base
# manifests — so anything set here wins over base. Keep that in mind when
# changing resource values: editing base alone does not change production.
#
# COMPONENT ORDERING TRAP: Kustomize applies component patches BEFORE the
# parent overlay's patches (overlays/instance-template). If the same field
# is patched by both this component and the overlay, the overlay wins and
# this component's patch is silently discarded. Only add patches here for
# fields that the instance-template overlay does NOT touch.
# The backup PVC size patches below are safe: instance-template no longer
# patches those fields, so this component's values reach prod cleanly.
#
# Keep this file as small as the difference actually is. A patch that restates
# base is not harmless: it silently overrides the next change to base, which is
# how prod ended up ignoring a memory increase made in base. So temporal-worker
# is no longer patched here at all (base carries the 768Mi/1Gi prod needs), and
# the backend-services patch sets the memory LIMIT only. Memory requests belong
# to base in every environment, because the request is the denominator of the
# HPA's memory utilization ratio.
patches:
  - path: backend-services-memory.yml
  # Production-only source-IP allowlist on the public Routes (see each file).
  - path: route-allowlist-backend.yml
  - path: route-allowlist-frontend.yml
  # Prod's temporal-pg data volume was expanded in-place to 5Gi (base is 1.5Gi).
  - target:
      kind: PostgresCluster
      name: temporal-pg
    patch: |
      - op: replace
        path: /spec/instances/0/dataVolumeClaimSpec/resources/requests/storage
        value: 5Gi
  # Prod's app-pg data volume was expanded in-place to 10Gi (base is 1.5Gi).
  - target:
      kind: PostgresCluster
      name: app-pg
    patch: |
      - op: replace
        path: /spec/instances/0/dataVolumeClaimSpec/resources/requests/storage
        value: 10Gi
  # Prod's backup PVC sizes. Both volumes were expanded by hand during the
  # June/July 2026 incidents and these values match what is live in fd34fb-prod:
  # a PostgresCluster requesting less than the bound PVC is rejected by the API,
  # which stalls the operator's pgBackRest reconcile. They live here, not in
  # instance-template, so the numbers are committed and visible.
  - target:
      kind: PostgresCluster
      name: app-pg
    patch: |
      - op: replace
        path: /spec/backups/pgbackrest/repos/0/volume/volumeClaimSpec/resources/requests/storage
        value: 15Gi
  - target:
      kind: PostgresCluster
      name: temporal-pg
    patch: |
      - op: replace
        path: /spec/backups/pgbackrest/repos/0/volume/volumeClaimSpec/resources/requests/storage
        value: 22Gi

