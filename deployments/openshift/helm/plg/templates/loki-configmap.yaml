apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "plg.loki.fullname" . }}-config
  labels:
    {{- include "plg.loki.labels" . | nindent 4 }}
data:
  loki.yaml: |
    auth_enabled: false

    server:
      http_listen_port: {{ .Values.loki.httpPort }}

    common:
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory

    schema_config:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    limits_config:
      retention_period: {{ include "plg.loki.retentionPeriod" . }}
      allow_structured_metadata: true
      ingestion_rate_mb: 4
      ingestion_burst_size_mb: 8

    ingester:
      # Hold idle streams in memory longer and flush larger chunks so Loki
      # creates far fewer chunk files. Fewer file create/delete cycles means
      # less kernel dentry/inode slab churn, which is the real driver of the
      # cgroup-v1 working-set growth behind past high-memory alerts. Loki's
      # heap has ample headroom (~100Mi used of a 2Gi limit), so a longer
      # idle period is safe. (An earlier 5m idle period reduced heap the wrong
      # way and increased file churn.)
      chunk_idle_period: 1h
      max_chunk_age: 2h
      chunk_target_size: 2097152

    compactor:
      working_directory: /loki/compactor
      compaction_interval: 10m
      retention_enabled: true
      retention_delete_delay: 2h
      retention_delete_worker_count: 20
      delete_request_store: filesystem

    analytics:
      reporting_enabled: false
