{{- if and .Values.alertmanager.notificationsEnabled (eq .Values.alertmanager.notificationChannel "ches") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "plg.chesAdapter.fullname" . }}
  labels:
    {{- include "plg.chesAdapter.labels" . | nindent 4 }}
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "plg.chesAdapter.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "plg.chesAdapter.labels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
      {{- if .Values.chesAdapter.imagePullSecret }}
      imagePullSecrets:
        - name: {{ .Values.chesAdapter.imagePullSecret }}
      {{- end }}
      containers:
        - name: ches-adapter
          image: "{{ .Values.chesAdapter.image.repository }}:{{ .Values.chesAdapter.image.tag }}"
          imagePullPolicy: {{ .Values.chesAdapter.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args: ["node dist/index.js 2>&1 | tee -a /var/log/app/ches-adapter.log"]
          ports:
            - name: http
              containerPort: {{ .Values.chesAdapter.port }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.chesAdapter.port | quote }}
            - name: CHES_ADAPTER_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.chesAdapter.secretName }}
                  key: chesAdapterSecret
            - name: CHES_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.chesAdapter.secretName }}
                  key: chesClientId
            - name: CHES_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.chesAdapter.secretName }}
                  key: chesClientSecret
            - name: CHES_AUTH_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.chesAdapter.secretName }}
                  key: chesAuthHost
            - name: CHES_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.chesAdapter.secretName }}
                  key: chesHost
            - name: CHES_FROM_EMAIL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.chesAdapter.secretName }}
                  key: chesFromEmail
            - name: CHES_TO_EMAILS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.chesAdapter.secretName }}
                  key: chesToEmails
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            {{- toYaml .Values.chesAdapter.resources | nindent 12 }}
          volumeMounts:
            - name: logs
              mountPath: /var/log/app
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
        # Caps the promtail hand-off buffer. The log file is only the hop
        # between the adapter and promtail: Loki holds the durable 30-day copy
        # and the node keeps the container's stdout, so the file only has to
        # carry the few seconds promtail has not shipped yet. Truncating in
        # place keeps the inode, so `tee -a` and promtail both continue
        # without a restart.
        - name: log-rotator
          image: {{ .Values.chesAdapter.sidecars.logRotator.image }}
          command: ["sh", "-c"]
          args:
            - |
              while true; do
                size=$(stat -c %s /var/log/app/ches-adapter.log 2>/dev/null || echo 0)
                if [ "$size" -gt 10485760 ]; then
                  : > /var/log/app/ches-adapter.log
                fi
                sleep 60
              done
          volumeMounts:
            - name: logs
              mountPath: /var/log/app
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "50m"
        - name: promtail
          image: {{ .Values.chesAdapter.sidecars.promtail.image }}
          args:
            - -config.file=/etc/promtail/promtail.yaml
          volumeMounts:
            - name: logs
              mountPath: /var/log/app
              readOnly: true
            - name: promtail-config
              mountPath: /etc/promtail
              readOnly: true
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "100m"
      volumes:
        - name: logs
          emptyDir: {}
        - name: promtail-config
          configMap:
            name: {{ include "plg.chesAdapter.fullname" . }}-promtail
{{- end }}
